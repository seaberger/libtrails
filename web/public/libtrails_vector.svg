<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Rounded square background -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220"
        fill="#1a1a2e" stroke="#a0a0ff" stroke-width="16"/>

  <!-- Constellation L lines -->
  <line x1="300" y1="780" x2="300" y2="280"
        stroke="#a0a0ff" stroke-width="28" stroke-linecap="round"/>

  <line x1="300" y1="780" x2="720" y2="780"
        stroke="#a0a0ff" stroke-width="24" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="300" cy="780" r="40" fill="#a0a0ff"/>
  <circle cx="300" cy="280" r="34" fill="#a0a0ff"/>
  <circle cx="720" cy="780" r="34" fill="#a0a0ff"/>

  <!-- Subtle small midpoint node -->
  <circle cx="300" cy="520" r="18" fill="#a0a0ff" opacity="0.85"/>

  <!-- Minimal background stars -->
  <circle cx="520" cy="360" r="6" fill="#a0a0ff" opacity="0.6"/>
  <circle cx="600" cy="500" r="5" fill="#a0a0ff" opacity="0.5"/>
  <circle cx="480" cy="620" r="5" fill="#a0a0ff" opacity="0.5"/>
  <circle cx="640" cy="420" r="4" fill="#a0a0ff" opacity="0.5"/>
  <circle cx="560" cy="700" r="4" fill="#a0a0ff" opacity="0.5"/>

</svg>
